name: Smoke test (temporary)

on:
  push:
    branches: [ "feature/liquid-glass-v2" ]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --console=plain
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke.sh
      - name: Report crashes
        if: always()
        run: |
          python3 - <<'PY'
          import os
          path = "shots/logcat.txt"
          if not os.path.exists(path):
              print("::error title=Smoke::no logcat captured")
          else:
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              keep = [l for l in lines if ("AndroidRuntime" in l or "FATAL" in l or "glassos" in l.lower() and (" E " in l or "Exception" in l))]
              msg = "%0A".join(l.replace("%", "%25")[:300] for l in keep[:120]) or "no crashes"
              print("::error title=Smoke log::" + msg)
          pid = open("shots/pid.txt").read().strip() if os.path.exists("shots/pid.txt") else "?"
          print("::error title=Smoke pid::" + pid)
          PY
      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots/* /tmp/out/ || true
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-smoke-shots
          git rm -rf . > /dev/null
          cp -r /tmp/out/* . || true
          git add -A && git commit -m "smoke screenshots" && git push -f origin ci-smoke-shots
